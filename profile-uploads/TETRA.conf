###############################################################################
#                                                                             #
#                Configuration file for the SvxLink server                    #
#                                                                             #
###############################################################################
# config file for Audio Test Thin Client Rolink 29.12.2025
# Optimized for PC microphone voice quality - 24.02.2026
[GLOBAL]
#MODULE_PATH=/usr/lib/arm-linux-gnueabihf/svxlink
#LOGIC_CORE_PATH=/usr/lib/arm-linux-gnueabihf/svxlink
LOGICS=SimplexLogic,ReflectorLogic
LINKS=ReflectorLink
CFG_DIR=svxlink.d
TIMESTAMP_FORMAT="%d.%m.%Y %H:%M:%S"
CARD_SAMPLE_RATE=48000
CARD_CHANNELS=1
#LOCATION_INFO=LocationInfo

[SimplexLogic]
TYPE=Simplex
DEFAULT_LANG=ro_A
RX=Rx1
TX=MultiTx

MODULES=ModuleHelp,ModuleParrot
#MODULES=ModuleHelp,ModuleParrot,ModuleEchoLink,ModuleMetarInfo
CALLSIGN=DK1AJ-T
#SHORT_CW_ID_ENABLE=1
#LONG_CW_ID_ENABLE=1
#CW_WPM=60
#CW_PITCH=750
SHORT_IDENT_INTERVAL=15
LONG_IDENT_INTERVAL=60
IDENT_ONLY_AFTER_TX=4
#EXEC_CMD_ON_SQL_CLOSE=500
EVENT_HANDLER=/usr/share/svxlink/events.tcl
RGR_SOUND_DELAY=50
RGR_SOUND_ALWAYS=1
FX_GAIN_NORMAL=-12
FX_GAIN_LOW=-30
#ACTIVATE_MODULE_ON_LONG_CMD=4:EchoLink
QSO_RECORDER=8:QsoRecorder
DTMF_CTRL_PTY=/tmp/dtmf_svx
#
MUTE_RX_ON_TX=1
MUTE_TX_ON_RX=1
DTMF_DEC_TYPE=0

###########################################################
###########################################################
[ReflectorLogic]
TYPE=ReflectorV2
#TYPE=Reflector
#HOSTS=reflector-test.brainic.ro
HOSTS=tetra.radiofarafiltru.ro 
HOST_PORT=5303
CALLSIGN=DK1AJ-P
AUTH_KEY=t3tr4
DEFAULT_TG=2263
MONITOR_TGS=7,11,12,13,2260+,2263,26277,262777
FMNET=TETRA 
#API=https://rolink.network/api/
#############################################################
JITTER_BUFFER_DELAY=250
UDP_HEARTBEAT_INTERVAL=30

ANNOUNCE_REMOTE_MIN_INTERVAL=300
EVENT_HANDLER=/usr/share/svxlink/events.tcl
NODE_INFO_FILE=/etc/svxlink/rolink.json
MUTE_FIRST_TX_LOC=0
MUTE_FIRST_TX_REM=0
TMP_MONITOR_TIMEOUT=3600
UDP_HEARTBEAT_INTERVAL=15
QSY_PENDING_TIMEOUT=-1
DEFAULT_LANG=ro_A
VERBOSE=0
#---------------------------------
# Opus encoder - optimized for PC microphone VoIP quality
OPUS_ENC_FRAME_SIZE=20
OPUS_ENC_COMPLEXITY=10
OPUS_ENC_BITRATE=64000
OPUS_ENC_VBR=1
OPUS_ENC_CVBR=1
OPUS_ENC_MAX_BANDWIDTH=FULLBAND
OPUS_ENC_BANDWIDTH=AUTO
OPUS_ENC_SIGNAL=VOICE
OPUS_ENC_APPLICATION=VOIP
OPUS_ENC_DTX=0
# Optional on lossy links:
#OPUS_ENC_FEC=1
#OPUS_ENC_PACKET_LOSS=5
#---------------------------

#--------------------------------
# Hardware PTT
[PTT1:SERIAL]
SQL_DET=SERIAL
SERIAL_PORT=/dev/ttyS0
# possible to use the DCD, CTS, DSR or RI pin.
SERIAL_PIN=CTS
SQL_START_DELAY=0
SQL_DELAY=10
SQL_HANGTIME=40
SQL_TIMEOUT=240

#----------------------------------------------------------
# PTT support from the dashboard
[PTT2:PTY]
SQL_DET=PTY
PTY_PATH=/tmp/SQL
SQL_START_DELAY=0
SQL_DELAY=0
SQL_HANGTIME=500
SQL_TIMEOUT=240

[PTT3:HID]
HID_DEVICE=/dev/cm108gpio
HID_SQL_PIN=VOL_DN

SQL_START_DELAY=500
SQL_HANGTIME=1500
SQL_DELAY=1500

#---------------------------------------------------------
[ReflectorLink]
CONNECT_LOGICS=SimplexLogic:9:SVX,ReflectorLogic
DEFAULT_ACTIVE=1
OPTIONS=DEFAULT_CONNECT,NO_DISCONNECT
TIMEOUT=0

#--------------------------------------------------------------
[Rx1]
# Microfon - PC microphone optimized
TYPE=Local
RX_ID=E
AUDIO_DEV=alsa:plughw:2

RAW_AUDIO_UDP_DEST=127.0.0.1:10000

AUDIO_CHANNEL=0
AUDIO_DEV_KEEP_OPEN=0
#----------------
#SQL_DET=PTT1:SERIAL
SQL_DET=COMBINE
SQL_COMBINE=PTT1:SERIAL|PTT2:PTY

#SQL_COMBINE=PTT3:HID|PTT2:PTY
# HID-DEVICE als Link wie in /etc/udev/rules.d/90-108.rules definiert
#HID_DEVICE=/dev/hidraw0
#SQL_DET=HIDRAW
#HID_SQL_PIN=VOL_DN 

PTT_HANGTIME=100
SQL_TAIL_ELIM=0
SQL_HANGTIME=500
PREAMP=3
PEAK_METER=0
DTMF_MUTING=0
1750_MUTING=0
PREEMPHASIS=0

# PC microphone voice quality settings
# Bypass radio-specific voiceband
VOICE_FILTER_BYPASS=1
# Disable limiter
LIMITER_THRESH=0

#LADSPA_PLUGINS=highpass_iir:350,lowpass_iir:2300,@Rx1_Compressor,@Rx1_Limiter
#LADSPA_PLUGINS=highpass_iir:500,lowpass_iir:2800
#LADSPA_PLUGINS=lowpass_iir:2800
#LADSPA_PLUGINS=highpass_iir:350
#------------------------------

[Rx1_Compressor]
LABEL=tap_dynamics_m
Attack=3         # ms (Fast to catch peaks)
Release=400      # ms (Smooth transition between syllables)
Makeup Gain=3   # dB (Boost quiet stations)
Function=11      # Function 11 (FM Compression Mode) is ideal because it:  Keeps speech clear and consistent

[Rx1_Limiter]
LABEL=tap_limiter
Limit Level=-9   # dB (Ensures output stays below -6 dB)
Output Volume=0  # dB (Keeps final volume unchanged)


#########################################################
#########################################################
##########################################################################
#--------------------------------------------------------
[MultiTx]
TYPE=Multi
TRANSMITTERS=Tx1,Tx2,TxUDP

#--------------------------------------------------------
# Casca
[Tx1]
TYPE=Local
TX_ID=T
AUDIO_DEV=alsa:plughw:2
AUDIO_CHANNEL=0
PTT_TYPE=NONE


TIMEOUT=240
TX_DELAY=100

CTCSS_LEVEL=-21
DEEMPHASIS=1
MASTER_GAIN=6
#-------------------
# Difuzor
[Tx2]
TYPE=Local
TX_ID=T
AUDIO_DEV=alsa:plughw:3
AUDIO_CHANNEL=0
PTT_TYPE=NONE
MASTER_GAIN=12
#-------------------
#--------------------------------------------

# Audio stream via UDP for VU Meter
[TxUDP]
TYPE=Local
AUDIO_DEV=udp:127.0.0.1:10001
CARD_SAMPLE_RATE=48000
AUDIO_CHANNEL=0
PTT_TYPE=NONE
MASTER_GAIN=0
TX_DELAY=100
PREEMPHASIS=0

#--------------------
[QsoRecorder]
REC_DIR=/var/spool/svxlink/qso_recorder
#MIN_TIME=1000
MAX_TIME=3600
SOFT_TIME=300
MAX_DIRSIZE=1024
#DEFAULT_ACTIVE=1
#TIMEOUT=300
#QSO_TIMEOUT=300

#---------------------------------------------------
[LocationInfo]
CALLSIGN=DK1AJ
SOURCE_CALLSIGN=DK1AJ
LOGIN_CALLSIGN=DK1AJ-1
APRS_SERVER_LIST=euro.aprs2.net:14580
STATUS_SERVER_LIST=aprs.echolink.org:5199
#FILTER=m/10
SYMBOL=/p
LON_POSITION=009.50.0E
LAT_POSITION=52.40.30N
FREQUENCY=430.005
#TX_OFFSET=-600
NARROW=0
TX_POWER=1
ANTENNA_GAIN=1
ANTENNA_HEIGHT=1m
#ANTENNA_DIR=-1
PATH=TCPIP*
BEACON_INTERVAL=90
STATISTICS_INTERVAL=10
STATISTICS_LOGIC=SimplexLogic
TONE=110
COMMENT=DK1AJ brainic.io
#PTY_PATH=/dev/shm/aprs_pty
DEBUG=1
