###############################################################################
#                                                                             #
#                Configuration file for the SvxLink server                    #
#                                                                             #
###############################################################################
# config file for Audio Test Thin Client Rolink 29.12.2025
[GLOBAL] 
#MODULE_PATH=/usr/lib/arm-linux-gnueabihf/svxlink
#LOGIC_CORE_PATH=/usr/lib/arm-linux-gnueabihf/svxlink
LOGICS=SimplexLogic,ReflectorLogic
LINKS=ReflectorLink
CFG_DIR=svxlink.d
TIMESTAMP_FORMAT="%d.%m.%Y %H:%M:%S"
CARD_SAMPLE_RATE=48000
CARD_CHANNELS=1
#LOCATION_INFO=LocationInfo

[SimplexLogic]
TYPE=Simplex
DEFAULT_LANG=ro_A
RX=Rx1
TX=MultiTx

MODULES=ModuleHelp,ModuleParrot
#MODULES=ModuleHelp,ModuleParrot,ModuleEchoLink,ModuleMetarInfo
CALLSIGN=MISU8
SHORT_CW_ID_ENABLE=1
LONG_CW_ID_ENABLE=1
CW_WPM=60
CW_PITCH=750
SHORT_IDENT_INTERVAL=15
LONG_IDENT_INTERVAL=60
IDENT_ONLY_AFTER_TX=4
#EXEC_CMD_ON_SQL_CLOSE=500
EVENT_HANDLER=/usr/share/svxlink/events.tcl
RGR_SOUND_DELAY=50
RGR_SOUND_ALWAYS=1 
FX_GAIN_NORMAL=-12
FX_GAIN_LOW=-30
#ACTIVATE_MODULE_ON_LONG_CMD=4:EchoLink
QSO_RECORDER=8:QsoRecorder
DTMF_CTRL_PTY=/tmp/dtmf_svx
#
MUTE_RX_ON_TX=1
MUTE_TX_ON_RX=1
DTMF_DEC_TYPE=0

###########################################################
###########################################################
[ReflectorLogic]
TYPE=ReflectorV2
#HOSTS=reflector-test.brainic.ro
HOSTS=svx.145500.xyz
HOST_PORT=5337
CALLSIGN=MISU8
AUTH_KEY=brainic.io
DEFAULT_TG=1337
MONITOR_TGS=9,20,1337
#FMNET=BRAINIC MISU
API=https://rolink.network/api/
#############################################################
JITTER_BUFFER_DELAY=250
UDP_HEARTBEAT_INTERVAL=30

ANNOUNCE_REMOTE_MIN_INTERVAL=300
EVENT_HANDLER=/usr/share/svxlink/events.tcl
NODE_INFO_FILE=/etc/svxlink/node_info.json
MUTE_FIRST_TX_LOC=0
MUTE_FIRST_TX_REM=0
TMP_MONITOR_TIMEOUT=3600
UDP_HEARTBEAT_INTERVAL=15
QSY_PENDING_TIMEOUT=-1
DEFAULT_LANG=ro_A
VERBOSE=0
OPUS_ENC_BITRATE=64000

#--------------------------------
# Hardware PTT
[PTT1:SERIAL]
SQL_DET=SERIAL
SERIAL_PORT=/dev/ttyS0
# possible to use the DCD, CTS, DSR or RI pin.
SERIAL_PIN=CTS
SQL_START_DELAY=0
SQL_DELAY=10
SQL_HANGTIME=40
SQL_TIMEOUT=240

#----------------------------------------------------------
# PTT support from the dashboard
[PTT2:PTY]
SQL_DET=PTY
PTY_PATH=/tmp/SQL
SQL_START_DELAY=1
SQL_START_DELAY=0
SQL_DELAY=0
SQL_HANGTIME=500
SQL_TIMEOUT=240

[PTT3:HID]
HID_DEVICE=/dev/cm108gpio
HID_SQL_PIN=VOL_DN

SQL_START_DELAY=500
SQL_HANGTIME=1500
SQL_DELAY=1500

#---------------------------------------------------------
[ReflectorLink]
CONNECT_LOGICS=SimplexLogic:9:SVX,ReflectorLogic
DEFAULT_ACTIVE=1
OPTIONS=DEFAULT_CONNECT,NO_DISCONNECT
TIMEOUT=0

#--------------------------------------------------------------
[Rx1]
# Microfon
TYPE=Local
RX_ID=E
AUDIO_DEV=alsa:plughw:2

RAW_AUDIO_UDP_DEST=127.0.0.1:10000

AUDIO_CHANNEL=0
AUDIO_DEV_KEEP_OPEN=0
LIMITER_THRESH=-6
#----------------
#SQL_DET=PTT1:SERIAL
SQL_DET=COMBINE
SQL_COMBINE=PTT1:SERIAL|PTT2:PTY

#SQL_COMBINE=PTT3:HID|PTT2:PTY
# HID-DEVICE als Link wie in /etc/udev/rules.d/90-108.rules definiert
#HID_DEVICE=/dev/hidraw0
#SQL_DET=HIDRAW
#HID_SQL_PIN=VOL_DN


PTT_HANGTIME=100
SQL_TAIL_ELIM=100
SQL_HANGTIME = 500
#PREAMP=3
#PEAK_METER=0
DTMF_MUTING=1
1750_MUTING=1
GAIN=9
#PREEMPHASIS=0

#LADSPA_PLUGINS=highpass_iir:350,lowpass_iir:2300
#LADSPA_PLUGINS=highpass_iir:500,lowpass_iir:2800
LADSPA_PLUGINS=lowpass_iir:2800
# PC microphone voice quality settings
# Bypass radio-specific voiceband 
VOICE_FILTER_BYPASS=0
# Disable limiter
LIMITER_THRESH=0


#########################################################
#########################################################
##########################################################################	 
#--------------------------------------------------------
[MultiTx]
TYPE=Multi
TRANSMITTERS=Tx1,Tx2,TxUDP

#--------------------------------------------------------
# Casca
[Tx1]
TYPE=Local
TX_ID=T
AUDIO_DEV=alsa:plughw:2
AUDIO_CHANNEL=0
PTT_TYPE=NONE

#PTT_TYPE=Hidraw
#HID_DEVICE=/dev/cm108gpio
#HID_PTT_PIN=GPIO3
#PTT_TYPE=SerialPin
#PTT_PORT=/dev/ttyS0
#PTT_PIN=DTR!RTS

TIMEOUT=240
TX_DELAY=100

CTCSS_LEVEL=-21
DEEMPHASIS=1
MASTER_GAIN=12
#-------------------
# Difuzor
[Tx2]
TYPE=Local
TX_ID=T
AUDIO_DEV=alsa:plughw:3
AUDIO_CHANNEL=0
PTT_TYPE=NONE
MASTER_GAIN=12
#-------------------
#--------------------------------------------

# Audio stream via UDP for VU Meter
[TxUDP]
TYPE=Local
AUDIO_DEV=udp:127.0.0.1:10001
CARD_SAMPLE_RATE=48000
AUDIO_CHANNEL=0
PTT_TYPE=NONE
MASTER_GAIN=0
TX_DELAY=100
PREEMPHASIS=0

#--------------------
[QsoRecorder]
REC_DIR=/var/spool/svxlink/qso_recorder
#MIN_TIME=1000
MAX_TIME=3600
SOFT_TIME=300
MAX_DIRSIZE=1024
#DEFAULT_ACTIVE=1
#TIMEOUT=300
#QSO_TIMEOUT=300

#---------------------------------------------------
[LocationInfo]
CALLSIGN=DK1AJ
SOURCE_CALLSIGN=DK1AJ
LOGIN_CALLSIGN=DK1AJ-1
APRS_SERVER_LIST=euro.aprs2.net:14580
STATUS_SERVER_LIST=aprs.echolink.org:5199
#FILTER=m/10
SYMBOL=/p
LON_POSITION=009.50.0E
LAT_POSITION=52.40.30N
FREQUENCY=430.005
#TX_OFFSET=-600
NARROW=0
TX_POWER=1
ANTENNA_GAIN=1
ANTENNA_HEIGHT=1m
#ANTENNA_DIR=-1
PATH=TCPIP*
BEACON_INTERVAL=90
STATISTICS_INTERVAL=10
STATISTICS_LOGIC=SimplexLogic
TONE=110
COMMENT=DK1AJ brainic.io
#PTY_PATH=/dev/shm/aprs_pty
DEBUG=1
