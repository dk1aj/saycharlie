{% extends 'base.html' %}

{% block title %}Category{% endblock %}
{% block heading %}📁 {{ svx_active_profile }}{% endblock %}
{% block content %}
    <style>
        .last-pressed-command {
            background-image: repeating-linear-gradient(
                    45deg,
                    rgba(255, 255, 255, 0.28) 0,
                    rgba(255, 255, 255, 0.28) 8px,
                    rgba(0, 0, 0, 0.12) 8px,
                    rgba(0, 0, 0, 0.12) 16px
            );
        }
    </style>
    <!-- Display category buttons -->
    <div class="grid grid-cols-{{ columns }} gap-4">
        {% for button in buttons_in_category %}
            <button onclick="markLastPressedCommand(this); sendDTMF('{{ button.action }}')"
                    class="bg-[{{ button.color }}] text-[{{ button.fontColor }}] text-lg font-semibold p-2 rounded-md
               active:bg-opacity-75 active:scale-95 active:ring-2 active:ring-[{{ button.color }}]">
                <span class="block">{{ button.label }}</span>
                <span class="block text-sm font-normal opacity-80">{{ button.action }}</span>
            </button>
        {% endfor %}
    </div>
    <script>
        function sendDTMF(dtmf_code) {
            fetch('/api/send_dtmf', {
                method: 'POST',
                body: JSON.stringify({dtmf_code: dtmf_code}),
                headers: {
                    'Content-Type': 'application/json',
                },
            }).then(async response => {
                if (response.ok) {
                    console.log('DTMF ' + dtmf_code + ' sent successfully');
                } else {
                    const data = await response.json();
                    alert('Failed to send DTMF: ' + data.message);
                }
            });
        }

        function markLastPressedCommand(button) {
            document.querySelectorAll('.last-pressed-command').forEach(function (pressedButton) {
                pressedButton.classList.remove('last-pressed-command');
            });
            button.classList.add('last-pressed-command');
        }
    </script>
{% endblock %}
